name: Bug report
description: Something in Pitwall shows the wrong thing, or nothing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste transcript files or screenshots of real work that may hold
        secrets or private code; describe what you saw instead, or reproduce it in demo mode (menu ⋯ → Demo mode).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: The context bar showed 12% but Claude Code's /context said 60%.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start two Claude Code agents in one workspace
        2. ...
    validations:
      required: true
  - type: input
    id: orca
    attributes:
      label: Orca version
      placeholder: 1.4.259
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (`claude --version`)
    validations:
      required: true
  - type: input
    id: pitwall
    attributes:
      label: Pitwall version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Model, auto-compact window setting, whether it happens in demo mode too.
