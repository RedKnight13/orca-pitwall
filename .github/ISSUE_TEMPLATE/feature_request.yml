name: Feature request
description: Something Pitwall should show or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the solution. "I run 6 agents and miss the one that failed" beats "add a red badge".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: agent
    attributes:
      label: Which agent
      options: [Claude Code, Codex, Gemini CLI, Other, Any]
